[workspace]
resolver = "3"
members = [
    "crates/rosetta-core",
    "crates/rosetta-encode",
    "crates/rosetta-bench",
    "crates/rosetta-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version. Not yet verified on this toolchain floor;
# see docs/architecture.md.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tpt-solutions/tpt-rosetta"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
